<text x="850.0" y="87" text-anchor="middle" font-size="16" font-weight="400" fill="#C9E4F2" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="850.0" y="87">Sin mediciones · alineación referencial de señales · sin solapamiento de desplazamiento y visualización</tspan></text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#225DA8"/></marker></defs>
<rect x="65" y="150" width="1570" height="62" rx="12" fill="#E9F1F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="850.0" y="188.0" text-anchor="middle" font-size="14" font-weight="400" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="850.0" y="188.0">Etapas:   (1) CARGA 64 COLUMNAS   →   (2) BLANQUEO + DIRECCIÓN   →   (3) LAT   →   (4) VISUALIZACIÓN (DWELL)</tspan></text>
<rect x="85" y="800" width="1525" height="65" rx="9" fill="#FFFFFF" stroke="#A33E40" stroke-width="2"/>
<text x="847.5" y="837.5" text-anchor="middle" font-size="14" font-weight="400" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="847.5" y="837.5">La dirección física de fila no está determinada (pin NC). Las duraciones son conceptuales; las restricciones de setup/hold exigen el datasheet real del panel.</tspan></text>
<rect x="85" y="885" width="1525" height="67" rx="9" fill="#FFFFFF" stroke="#225DA8" stroke-width="2"/>
<text x="847.5" y="923.5" text-anchor="middle" font-size="14" font-weight="400" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="847.5" y="923.5">Con reloj de 27 MHz: Tsys ≈ 37,04 ns. El período de CLK de salida y el dwell se elegirán después de definir estados, latencia de BRAM y controladores.</tspan></text>
