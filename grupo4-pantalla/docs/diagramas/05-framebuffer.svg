<polygon points="985,620 974.7697057352859,626.2722467471679 974.7697057352859,613.7277532528321" fill="#225DA8"/>
<rect x="895" y="594" width="180" height="21" rx="4" fill="#F8FAFD" opacity="0.94"/>
<text x="985" y="610" text-anchor="middle" font-size="12" font-weight="700" fill="#225DA8" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="985" y="610">6 bits por columna</tspan></text>
<rect x="65" y="235" width="345" height="160" rx="15" fill="#FFFFFF" stroke="#225DA8" stroke-width="3"/><rect x="65" y="235" width="345" height="9" rx="5" fill="#225DA8"/><text x="237.5" y="296.0" text-anchor="middle" font-size="18" font-weight="700" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="237.5" y="296.0">Coordenada (x,y)</tspan></text><text x="237.5" y="324.0" text-anchor="middle" font-size="14" font-weight="400" fill="#52677E" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="237.5" y="324.0">0≤x&lt;64  ·  0≤y&lt;64</tspan><tspan x="237.5" y="345.0">Color = {R,G,B} (3 bits)</tspan></text>
<rect x="495" y="235" width="390" height="165" rx="15" fill="#FFFFFF" stroke="#087F84" stroke-width="3"/><rect x="495" y="235" width="390" height="9" rx="5" fill="#087F84"/><text x="690.0" y="287.0" text-anchor="middle" font-size="18" font-weight="700" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="690.0" y="287.0">Direcciones lógicas</tspan></text><text x="690.0" y="315.0" text-anchor="middle" font-size="14" font-weight="400" fill="#52677E" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="690.0" y="315.0">index = 64·y + x</tspan><tspan x="690.0" y="336.0">4096 píxeles × 3 bits</tspan><tspan x="690.0" y="357.0">= 12 288 bits = 1536 B</tspan></text>
<rect x="985" y="235" width="440" height="165" rx="15" fill="#FFFFFF" stroke="#225DA8" stroke-width="3"/><rect x="985" y="235" width="440" height="9" rx="5" fill="#225DA8"/><text x="1205.0" y="287.0" text-anchor="middle" font-size="18" font-weight="700" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="1205.0" y="287.0">Framebuffer BSRAM</tspan></text><text x="1205.0" y="315.0" text-anchor="middle" font-size="14" font-weight="400" fill="#52677E" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="1205.0" y="315.0">Implementación por definir</tspan><tspan x="1205.0" y="336.0">lectura + escritura concurrentes</tspan><tspan x="1205.0" y="357.0">o arbitraje</tspan></text>
<rect x="495" y="540" width="390" height="160" rx="15" fill="#FFFFFF" stroke="#AD6614" stroke-width="3"/><rect x="495" y="540" width="390" height="9" rx="5" fill="#AD6614"/><text x="690.0" y="601.0" text-anchor="middle" font-size="17" font-weight="700" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="690.0" y="601.0">Lectura por pares (hipótesis)</tspan></text><text x="690.0" y="629.0" text-anchor="middle" font-size="14" font-weight="400" fill="#52677E" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="690.0" y="629.0">(x, fila) y (x, fila+32)</tspan><tspan x="690.0" y="650.0">6 bits: RGB superior + inferior</tspan></text>
<rect x="985" y="540" width="440" height="160" rx="15" fill="#FFFFFF" stroke="#23745B" stroke-width="3"/><rect x="985" y="540" width="440" height="9" rx="5" fill="#23745B"/><text x="1205.0" y="589.5" text-anchor="middle" font-size="18" font-weight="700" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="1205.0" y="589.5">Carga en panel</tspan></text><text x="1205.0" y="617.5" text-anchor="middle" font-size="14" font-weight="400" fill="#52677E" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="1205.0" y="617.5">RGB1/RGB2 en paralelo</tspan><tspan x="1205.0" y="638.5">CLK una vez por columna</tspan><tspan x="1205.0" y="659.5">64 columnas por grupo</tspan></text>
<rect x="65" y="755" width="1360" height="93" rx="9" fill="#FFFFFF" stroke="#A33E40" stroke-width="2"/>
<text x="745.0" y="795.5" text-anchor="middle" font-size="14" font-weight="400" fill="#162A40" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="745.0" y="795.5">La relación fila+32 y las 32 direcciones son propias del barrido 1/32 convencional. Si el panel usa dirección desplazada, la lógica de mapeo debe adaptarse;</tspan><tspan x="745.0" y="817.5">NO se ha validado el pin NC.</tspan></text>
</svg>