<text x="755.0" y="53" text-anchor="middle" font-size="29" font-weight="700" fill="#FFFFFF" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="755.0" y="53">Framebuffer mínimo: mapa de datos</tspan></text>
<text x="755.0" y="87" text-anchor="middle" font-size="16" font-weight="400" fill="#C9E4F2" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="755.0" y="87">Propuesta de 3 bits/píxel (RGB111) para patrón de prueba y arquitectura inicial</tspan></text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#225DA8"/></marker></defs>
