<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="580" viewBox="0 0 1550 580"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2355AA"/></marker></defs><rect x="0" y="0" width="1550" height="580" fill="#FAFCFF"/><text x="50" y="63" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#14243B">B.3 — Escritura MMIO: apagar la pantalla</text><text x="50" y="99" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#48617E">Ejemplo: el procesador escribe 0 en 0x004C0000</text><rect x="35" y="165" width="240" height="190" rx="18" fill="#EAF1FD" stroke="#2355AA" stroke-width="2"/><circle cx="61" cy="156" r="15" fill="#2355AA"/><text x="61" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text><text x="155.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2355AA">CPU FemtoRV32</text><text x="155.0" y="248" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">Dirección:</text><text x="155.0" y="279" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">0x004C0000</text><text x="155.0" y="310" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">WR = 1, DIN[0] = 0</text><rect x="350" y="165" width="240" height="190" rx="18" fill="#F4EFFD" stroke="#7355AD" stroke-width="2"/><circle cx="376" cy="156" r="15" fill="#7355AD"/><text x="376" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text><text x="470.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#7355AD">Global (G6)</text><text x="470.0" y="248" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">Reconoce la región</text><text x="470.0" y="279" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">de control del panel</text><text x="470.0" y="310" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">Produce cs = 1</text><rect x="665" y="165" width="240" height="190" rx="18" fill="#FFF5DF" stroke="#A96804" stroke-width="2"/><circle cx="691" cy="156" r="15" fill="#A96804"/><text x="691" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text><text x="785.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#A96804">Local (G4)</text><text x="785.0" y="248" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">addr = 0x00</text><text x="785.0" y="279" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">wr = 1, rd = 0</text><text x="785.0" y="310" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">Activa wr_control</text><rect x="980" y="165" width="240" height="190" rx="18" fill="#E5F6F0" stroke="#126E54" stroke-width="2"/><circle cx="1006" cy="156" r="15" fill="#126E54"/><text x="1006" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text><text x="1100.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#126E54">CONTROL</text><text x="1100.0" y="248" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">En flanco de clk:</text><text x="1100.0" y="279" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">DISPLAY_EN ← 0</text><rect x="1295" y="165" width="220" height="190" rx="18" fill="#E5F6F0" stroke="#126E54" stroke-width="2"/><circle cx="1321" cy="156" r="15" fill="#126E54"/><text x="1321" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text><text x="1405.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#126E54">Salida OE</text><text x="1405.0" y="248" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">Fuerza OE = 1</text><text x="1405.0" y="279" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">LED apagados</text><path d="M280 265 L342 265" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M595 265 L657 265" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M910 265 L972 265" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M1225 265 L1287 265" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><rect x="35" y="399" width="1480" height="115" rx="13" fill="#F2F6FC" stroke="#D5DFEC" stroke-width="2"/><text x="60" y="434" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2355AA">ECUACIÓN DEL DECODIFICADOR</text><text x="60" y="468" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#14243B">wr_control = cs AND wr AND (NOT rd) AND (addr == 0x00)</text><text x="60" y="498" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#48617E">CONTROL se actualiza en un flanco positivo y conserva el valor escrito.</text><text x="35" y="552" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#48617E">Nota: la región 0x004C0000 y los registros son propuestas; la conexión global al SoC aún no está hecha.</text></svg>