<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="580" viewBox="0 0 1550 580"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2355AA"/></marker></defs><rect x="0" y="0" width="1550" height="580" fill="#FAFCFF"/><text x="46" y="59" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#14243B">B.3 — Lectura MMIO: consultar un registro</text><text x="46" y="97" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#48617E">La CPU proporciona una dirección de lectura; el periférico devuelve un dato de 32 bits.</text><rect x="35" y="156" width="240" height="177" rx="18" fill="#EAF1FD" stroke="#2355AA" stroke-width="2"/><circle cx="61" cy="147" r="15" fill="#2355AA"/><text x="61" y="153" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text><text x="155.0" y="199" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2355AA">CPU FemtoRV32</text><text x="155.0" y="239" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">RD = 1</text><text x="155.0" y="270" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">Dirección de registro</text><rect x="350" y="156" width="240" height="177" rx="18" fill="#F4EFFD" stroke="#7355AD" stroke-width="2"/><circle cx="376" cy="147" r="15" fill="#7355AD"/><text x="376" y="153" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text><text x="470.0" y="199" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#7355AD">Global (G6)</text><text x="470.0" y="239" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">Selecciona región</text><text x="470.0" y="270" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">0x004C0000</text><text x="470.0" y="301" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#14243B">cs = 1</text><rect x="665" y="156" width="240" height="177" rx="18" fill="#FFF5DF" stroke="#A96804" stroke-width="2"/><circle cx="691" cy="147" r="15" fill="#A96804"/><text x="691" y="153" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text><text x="785.0" y="199" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#A96804">Local (G4)</text><text x="785.0" y="239" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#14243B">Comprueba addr</text><text x="785.0" y="270" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#14243B">y activa rd_control,</text><text x="785.0" y="301" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#14243B">rd_status o rd_frames</text><rect x="980" y="156" width="240" height="177" rx="18" fill="#E5F6F0" stroke="#126E54" stroke-width="2"/><circle cx="1006" cy="147" r="15" fill="#126E54"/><text x="1006" y="153" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text><text x="1100.0" y="199" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#126E54">Mux de lectura</text><text x="1100.0" y="239" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">Selecciona el</text><text x="1100.0" y="270" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">valor del registro</text><rect x="1295" y="156" width="220" height="177" rx="18" fill="#E5F6F0" stroke="#126E54" stroke-width="2"/><circle cx="1321" cy="147" r="15" fill="#126E54"/><text x="1321" y="153" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text><text x="1405.0" y="199" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#126E54">Respuesta</text><text x="1405.0" y="239" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">d_out[31:0]</text><text x="1405.0" y="270" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#14243B">registrado</text><path d="M280 250 L342 250" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M595 250 L657 250" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M910 250 L972 250" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M1225 250 L1287 250" stroke="#2355AA" stroke-width="3" fill="none" marker-end="url(#tip)"/><rect x="35" y="376" width="1480" height="140" rx="13" fill="#F2F6FC" stroke="#D5DFEC" stroke-width="2"/><text x="60" y="414" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#2355AA">¿QUÉ REGISTRO SELECCIONA addr[4:0]?</text><text x="75" y="460" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#14243B">0x00   CONTROL</text><text x="75" y="487" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#48617E">Lee DISPLAY_EN</text><text x="550" y="460" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#14243B">0x04   STATUS</text><text x="550" y="487" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#48617E">Lee habilitación</text><text x="1024" y="460" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#14243B">0x08   FRAMES</text><text x="1024" y="487" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#48617E">Lee número de cuadros</text><text x="35" y="552" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#48617E">STATUS no indica BUSY. FRAMES requiere frame_done, aún pendiente de conectar al controlador HUB75E.</text></svg>